name: xiaojia_ledger
description: 小满记账 - 智能记账App
publish_to: 'none'
version: 7.0.10+37

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  characters: ^1.4.0
  dio: ^5.4.0
  shared_preferences: ^2.3.0
  provider: ^6.1.0
  fl_chart: ^0.70.0
  intl: ^0.20.0
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  google_fonts: ^6.2.0
  image_picker: ^1.1.0
  flutter_local_notifications: ^18.0.0
  permission_handler: ^11.0.0
  flutter_secure_storage: ^9.0.0
  url_launcher: ^6.0.0
  timezone: ^0.10.1
  record: ^6.1.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#273640"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  adaptive_icon_foreground_inset: 0
flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/china_regions.json
